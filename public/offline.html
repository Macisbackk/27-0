<!doctype html>
<html lang="en-GB">
<head>

<title>27-0 — offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #121228; color: #eef5f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }

  p { margin: 0; max-width: 300px; color: #a7b8ae; font-size: 15px; line-height: 1.45; }
  button { margin-top: 8px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 4px; background: #9346ff; color: #ffffff; font: 700 16px system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <div class="logo">27-<span>0</span></div>

  <button type="button" onclick="location.reload()">Try again</button>
