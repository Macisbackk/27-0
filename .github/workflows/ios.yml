name: iPhone app (build check)

# Proves the 27-0 iPhone app builds. Creates the Capacitor iOS project on a Mac runner and builds it
# for the simulator (no Apple account needed). The generated ios/ folder is uploaded as an artifact
# so it can be committed once you're ready for the App Store.
# Paused on PRs until the app store work starts again — run it by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wpkwcaxzrmutacizenzg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwa3djYXh6cm11dGFjaXplbnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDM4ODAsImV4cCI6MjA5NjU3OTg4MH0.ulOvyz0GEO5VRZN7AvngP_Ju96XjVwHhoSQ4gDbL7FY
      NEXT_PUBLIC_SITE_URL: https://27-0.co.uk
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Add the iOS platform
        run: npm install --no-save @capacitor/ios@^8.5.0
      - name: Static export for the app
        run: npm run build:mobile
      - name: Create / sync the iOS project
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Build for the iPhone simulator
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then target="-workspace App.xcworkspace"; else target="-project App.xcodeproj"; fi
          xcodebuild $target -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: 27-0-ios-project
          path: |
            ios
            !ios/App/App/public
            !ios/**/build
          retention-days: 30
