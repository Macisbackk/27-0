name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate player database
        run: npm run validate:player-database
      - name: Slim runtime player data is up to date
        run: npm run check:runtime-player-data
      - name: Validate quiz bank
        run: npm run validate:quiz

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Manager Mode career engine
        if: success() || failure()
        run: scripts/ci-run.sh "Manager Mode career engine" npm run test:career
      - name: Play-off simulation
        if: success() || failure()
        run: scripts/ci-run.sh "Play-off simulation" npm run test:playoffs
      - name: Quiz
        if: success() || failure()
        run: scripts/ci-run.sh "Quiz" npm run test:quiz
      - name: Wordle
        if: success() || failure()
        run: scripts/ci-run.sh "Wordle" npm run test:wordle
      - name: Grid
        if: success() || failure()
        run: scripts/ci-run.sh "Grid" npm run test:grid
      - name: Daily Challenge rules
        if: success() || failure()
        run: scripts/ci-run.sh "Daily Challenge rules" npm run test:daily-rules
      - name: Squad chemistry + halfway call
        if: success() || failure()
        run: scripts/ci-run.sh "Squad chemistry + halfway call" npm run test:chemistry
      - name: 27-0 season formula
        if: success() || failure()
        run: scripts/ci-run.sh "27-0 season formula" npm run test:sim
      - name: Share result text
        if: success() || failure()
        run: scripts/ci-run.sh "Share result text" npm run test:share
      - name: Challenge links, pick rarity, records
        if: success() || failure()
        run: scripts/ci-run.sh "Challenge links, pick rarity, records" npm run test:social
      - name: Weekly Challenge
        if: success() || failure()
        run: scripts/ci-run.sh "Weekly Challenge" npm run test:weekly
      - name: Weekly calendar themes
        if: success() || failure()
        run: scripts/ci-run.sh "Weekly calendar themes" npm run test:weekly-themes
      - name: One-Club XI
        if: success() || failure()
        run: scripts/ci-run.sh "One-Club XI" npm run test:one-club
      - name: Gauntlet
        if: success() || failure()
        run: scripts/ci-run.sh "Gauntlet" npm run test:gauntlet
      - name: Daily archive
        if: success() || failure()
        run: scripts/ci-run.sh "Daily archive" npm run test:daily-archive
      - uses: oven-sh/setup-bun@v2
        if: success() || failure()
      - name: Squad Book
        if: success() || failure()
        run: scripts/ci-run.sh "Squad Book" npm run test:squadbook
      - name: Daily missions
        if: success() || failure()
        run: scripts/ci-run.sh "Daily missions" npm run test:missions
      - name: Coach-name moderation
        if: success() || failure()
        run: scripts/ci-run.sh "Coach-name moderation" npm run test:moderation

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production build
        # Placeholder Supabase env so the build mirrors production config shape.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_E2E: "1"
        run: scripts/ci-run.sh "Production build" npm run build
      - name: Bundle size report
        continue-on-error: true
        run: |
          echo "## First-load JS per route" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs=require("fs"),path=require("path");
            const m=JSON.parse(fs.readFileSync(".next/app-build-manifest.json","utf8")).pages;
            const size=f=>{try{return fs.statSync(path.join(".next",f)).size}catch{return 0}};
            const rows=Object.entries(m).filter(([r])=>r.endsWith("/page")).map(([r,fs_])=>[r,fs_.filter(f=>f.endsWith(".js")).reduce((a,f)=>a+size(f),0)]).sort((a,b)=>b[1]-a[1]);
            const out=["| Route | First-load JS (raw) |","|---|---|",...rows.map(([r,s])=>`| ${r} | ${(s/1024).toFixed(0)} KB |`)].join("\n");
            console.log(out); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out+"\n");
            const top=rows.map(([r,s])=>`${r}: ${(s/1024).toFixed(0)} KB`).join("%0A");
            console.log(`::notice title=First-load JS per route::${top}`);
          '
      # The browser suites below run in parallel from this one build (was ~25 min in series).
      - name: Pack the build
        run: tar --exclude=.next/cache -czf next-build.tgz .next
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tgz
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        suite: [site-crawl, site-play, site-rest, manager, stress]
    name: e2e (${{ matrix.suite }})
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xzf next-build.tgz && rm next-build.tgz
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-chromium
      - name: Install Playwright (not in package.json)
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Start the site
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
      - name: Whole-site break test (mobile + desktop)
        if: startsWith(matrix.suite, 'site-')
        env:
          SITE_SHARD: ${{ matrix.suite == 'site-crawl' && 'crawl' || matrix.suite == 'site-play' && 'play' || 'rest' }}
        run: scripts/ci-run.sh "Site e2e ($SITE_SHARD)" node scripts/e2e-site.mjs
      - name: Manager Mode end-to-end (mobile)
        if: matrix.suite == 'manager'
        run: |
          scripts/ci-run.sh "Manager Mode e2e" node scripts/e2e-career.mjs
          scripts/ci-run.sh "Manager Mode chaos e2e" node scripts/e2e-career-chaos.mjs
      - name: Stress test (new features)
        if: matrix.suite == 'stress'
        run: scripts/ci-run.sh "Stress test" node scripts/e2e-stress.mjs
      - name: UI audit screenshots (phone + desktop)
        # Off by default. Add the "ui-audit" label to a PR to run it (site suite only).
        if: (success() || failure()) && matrix.suite == 'site-crawl' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ui-audit')
        continue-on-error: true
        timeout-minutes: 25
        run: |
          timeout 900 node scripts/ui-audit.mjs
          timeout 300 node scripts/text-fit-audit.mjs || true
          timeout 300 node scripts/store-screenshots.mjs || true
      - name: Publish e2e screenshots (same-repo PRs only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('e2e-shots/*.png') != ''
        run: |
          branch="ci-shots/pr-${{ github.event.pull_request.number }}-${{ matrix.suite }}"
          mkdir -p /tmp/shots && cp e2e-shots/*.png /tmp/shots/ && cp e2e-shots/*.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          # Screenshot branches are not sites: stop Vercel building them (each one used up a daily deploy).
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b "$branch"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "e2e screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"
