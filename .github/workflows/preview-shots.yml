name: Preview screenshots

# Quick look at a branch without a Vercel deploy: build, start, screenshot the main screens.
# Push to any branch named preview/<something>; shots land on branch preview-shots/<something>.
on:
  push:
    branches: ["preview/**"]

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Screenshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          node scripts/preview-shots.mjs
          # Manager Mode break run (report only: preview-shots/manager-break.txt).
          [ -f scripts/manager-break.mjs ] && (timeout 600 node scripts/manager-break.mjs || true)
          # Popup audit (report only: preview-shots/popup-audit.txt).
          [ -f scripts/popup-audit.mjs ] && (timeout 400 node scripts/popup-audit.mjs || true)
          # Hydration probe: prod first, then a dev server (full React messages) from a copy of the
          # repo so its .next folder doesn't clobber the prod build.
          if [ -f scripts/hydration-probe.mjs ]; then
            PROBE_TARGETS=http://localhost:3000 timeout 300 node scripts/hydration-probe.mjs || true
            mv preview-shots/hydration-probe.txt preview-shots/hydration-probe-prod.txt || true
            mkdir -p /tmp/devcopy && rsync -a --exclude .next --exclude node_modules --exclude preview-shots ./ /tmp/devcopy/ && ln -s "$PWD/node_modules" /tmp/devcopy/node_modules
            (cd /tmp/devcopy && npx next dev -p 3100 > /tmp/next-dev.log 2>&1 &)
            for i in $(seq 1 120); do curl -sf http://localhost:3100/ > /dev/null && break; sleep 2; done
            PROBE_TARGETS=http://localhost:3100 PROBE_WIDTHS=375 timeout 600 node scripts/hydration-probe.mjs || true
            mv preview-shots/hydration-probe.txt preview-shots/hydration-probe-dev.txt || true
            tail -50 /tmp/next-dev.log > preview-shots/next-dev-tail.txt || true
          fi
      - name: Publish
        run: |
          name="${GITHUB_REF_NAME#preview/}"
          branch="preview-shots/$name"
          cd preview-shots
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b "$branch"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "preview screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"
