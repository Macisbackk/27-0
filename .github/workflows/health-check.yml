name: Health check

# Mobile performance (live site), save reliability (guest progress through refreshes and
# browser restarts) and a game balance report. Report-first: performance and balance never
# fail; a lost save does. Runs weekly, on demand, and on health/* branches.
on:
  workflow_dispatch:
    inputs:
      perf_url:
        description: "Site to measure"
        default: "https://www.27-0.co.uk"
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: ["health/**"]

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - name: Game balance report
        run: bun scripts/health-balance-report.ts 150 6 | tee balance.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: balance.md

  mobile-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Mobile performance (live site)
        run: node scripts/health-mobile-perf.mjs "${{ github.event.inputs.perf_url || 'https://www.27-0.co.uk' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-perf
          path: health/

  save-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Start the site
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
      - name: Save reliability (guest, phone)
        run: node scripts/health-save-reliability.mjs http://localhost:3000
